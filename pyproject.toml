[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amscrot-py"
dynamic = ["version"]
description = "AmSC Resource Orchestration Client Toolkit"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["AmSC Resource Orchestration Toolkit", "Fabfed Framework", "Cloud", "FABRIC", "Chameleon", "MOC"]
license = {text = "MIT License"}
authors = [
  {name = "Abdelilah Essiari", email = "aessiari@lbl.gov"},
  {name = "Ezra Kissel", email = "kissel@es.net"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Core: only what the IRI service-client path imports
dependencies = [
    "amsc-iri==1.2.0",
    "pydantic>=2",
    "PyYAML>=6",
]

[project.optional-dependencies]
fabric = ["fabrictestbed-extensions"]
chi = ["python-chi==0.17.11", "paramiko==4.0.0"]
sense = ["sense-o-api==1.52"]
janus = ["ansible==9.5.1", "ansible-runner==2.3.6"]
# KubeProvider drives nodes through the janus ansible helper, so kube pulls janus.
kube = ["amscrot-py[janus]", "kubernetes==35.0.0"]
cloudlab = ["xmltodict"]
aws = ["boto3"]
gcp = ["google-cloud-compute"]
all = ["amscrot-py[fabric,chi,sense,janus,kube,cloudlab,aws,gcp]"]

[project.urls]
Homepage = "https://github.com/esnet/amsc-isro-toolkit"

[project.scripts]
amscrot = "tools.cli:main"
fabfed = "tools.cli:main"

[tool.setuptools.dynamic]
version = {attr = "amscrot.__VERSION__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.package-data]
amscrot = ["**/*.json", "**/*.yml", "**/*.j2"]
