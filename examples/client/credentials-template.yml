# AmSCROT Credentials Template
# Fill in the api_key / secret fields and place this file at:
#   ~/.amscrot/credentials.yml
# Alternatively, pass the path directly to ServiceClient() or Client() constructors.

kube:
  api_endpoint:
  config: /local/.kube/config
esnet-iri-east:
  client_type: AMSC_IRI
  api_key:
  api_endpoint: https://iri-dev.ppg.es.net
  api_version: 1           # pin to v1 if using direct facility v1 credentials (omit to auto-probe highest version)

esnet-iri-west:
  client_type: AMSC_IRI
  api_endpoint: https://esnet-west.sdn-sense.net
  api_key:
  api_version: 1

nersc-iri:
  client_type: AMSC_IRI
  api_endpoint: https://api.iri.nersc.gov
  api_key:
  api_version: 1

alcf-iri:
  client_type: AMSC_IRI
  api_endpoint: https://api.alcf.anl.gov
  api_key:
  api_version: 1

# Resource Interface Gateway (RIG) -- auto-discovers every IRI endpoint.
#
# A single AMSC_RIG entry replaces the per-facility blocks that used to be
# listed here. On startup the toolkit calls the gateway's /ready endpoint once
# and registers an IriServiceClient for each facility it fronts, named
# <shorthand>-rig (nersc-rig, esnet-east-rig, olcf-open-rig, ...).
#
# The API version of each facility comes from the gateway, so it never has to
# be hand-maintained here and never drifts out of date.
#
# pat_file can point to ~/.amsc_token.json (JSON with AMSC_PAT) or
# ~/.amsc_pat (plain text token).
amsc-rig:
  client_type: AMSC_RIG
  api_endpoint: https://rig.staging.american-science-cloud.org
  pat_file: ~/.amsc_token.json

  # Optional filters:
  # facilities: [nersc, esnet-east]     # only expand these
  # exclude_facilities: [olcf-moderate] # never expand these
  # skip_unhealthy: true                # drop facilities the RIG isn't monitoring
  # child_prefix: "amsc-"               # prefix generated client names

amsc-iro:
  client_type: AMSC_IRO
  auth_endpoint: https://sense-o-east.es.net:8543/realms/StackV/protocol/openid-connect/token
  api_endpoint: https://sense-o-east.es.net:8443/StackV-web/restapi
  api_key: 
  token_issuer: https://auth.globus.org
  client_id: amsc-iro-demo
  secret: 
  iri_api_token: