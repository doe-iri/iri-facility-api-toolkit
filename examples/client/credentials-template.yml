# AmSCROT Credentials Template
# Fill in the api_key / secret fields and place this file at:
#   ~/.amscrot/credentials.yml
# Alternatively, pass the path directly to ServiceClient() or Client() constructors.

kube:
  api_endpoint:
  config: /local/.kube/config
esnet-iri-east:
  client_type: AMSC_IRI
  api_key:
  api_endpoint: https://iri-dev.ppg.es.net
  api_version: 1           # pin to v1 if using direct facility v1 credentials (omit to auto-probe highest version)

esnet-iri-west:
  client_type: AMSC_IRI
  api_endpoint: https://esnet-west.sdn-sense.net
  api_key:
  api_version: 1

nersc-iri:
  client_type: AMSC_IRI
  api_endpoint: https://api.iri.nersc.gov
  api_key:
  api_version: 1

alcf-iri:
  client_type: AMSC_IRI
  api_endpoint: https://api.alcf.anl.gov
  api_key:
  api_version: 1

# Resource Integration Gateway (RIG) Endpoints (v2 authenticated with AmSC PAT)
# pat_file can point to ~/.amsc_token.json (JSON with AMSC_PAT) or ~/.amsc_pat (plain text token)
esnet-iri-east-rig:
  client_type: AMSC_IRI
  api_endpoint: https://rig.staging.american-science-cloud.org/rig/external/esnet-east/
  pat_file: ~/.amsc_token.json
  api_version: 2

esnet-iri-west-rig:
  client_type: AMSC_IRI
  api_endpoint: https://rig.staging.american-science-cloud.org/rig/external/esnet-west/
  pat_file: ~/.amsc_token.json
  api_version: 2

nersc-iri-rig:
  client_type: AMSC_IRI
  api_endpoint: https://rig.staging.american-science-cloud.org/rig/external/nersc/
  pat_file: ~/.amsc_token.json
  api_version: 2

alcf-iri-rig:
  client_type: AMSC_IRI
  api_endpoint: https://rig.staging.american-science-cloud.org/rig/external/alcf/
  pat_file: ~/.amsc_token.json
  api_version: 2

amsc-iro:
  client_type: AMSC_IRO
  auth_endpoint: https://sense-o-east.es.net:8543/realms/StackV/protocol/openid-connect/token
  api_endpoint: https://sense-o-east.es.net:8443/StackV-web/restapi
  api_key: 
  token_issuer: https://auth.globus.org
  client_id: amsc-iro-demo
  secret: 
  iri_api_token: