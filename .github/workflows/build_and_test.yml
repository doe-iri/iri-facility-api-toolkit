name: Build and Test

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet build
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi
          pip install --quiet -e .
          # Ensure pytest is installed just in case it's not in requirements.txt or setup.py
          pip install --quiet pytest

      - name: Test
        run: |
          pytest -v --tb=short -m "not integration" --junitxml=report.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: report.xml
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet build
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi
          pip install --quiet -e .

      - name: Build
        run: |
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 30
